<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microstock Metadata Generator</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:rgba(0,0,0,.08);--fill:#f2f2f4;--acc:#0071e3;--warn:#b25e00;--bad:#d70015;--ok:#248a3d;--glass:rgba(255,255,255,.72);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:rgba(255,255,255,.1);--fill:#2c2c2e;--acc:#2997ff;--warn:#ffb340;--bad:#ff6961;--glass:rgba(28,28,30,.72);--sh:0 8px 30px rgba(0,0,0,.5)}}
[hidden]{display:none!important}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.nav{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 980px)/2));background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);font-size:14px}
.nav b{font-weight:600}.nav span{color:var(--mute)}
.hero{text-align:center;padding:72px 20px 40px;max-width:820px;margin:0 auto}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1.05;letter-spacing:-.03em;font-weight:700;margin:0 0 16px}
.hero p{font-size:clamp(18px,2.4vw,24px);line-height:1.35;color:var(--mute);margin:0 auto;max-width:640px;letter-spacing:-.015em}
main{max-width:980px;margin:0 auto;padding:0 20px 140px}
.panel{background:var(--card);border-radius:22px;padding:28px;margin-bottom:20px;box-shadow:var(--sh)}
#drop{text-align:center;padding:56px 24px;border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--mute);transition:background .2s,border-color .2s,transform .2s}
#drop.hov{border-color:var(--acc);background:var(--card);transform:scale(1.01)}
#drop .big{display:block;font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 2px;font-weight:500}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--fill);border:1px solid transparent;border-radius:12px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
input,select{min-width:210px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
button{font:inherit;font-size:15px;color:var(--acc);background:transparent;border:0;border-radius:980px;padding:10px 20px;cursor:pointer;transition:background .15s,transform .1s,opacity .15s}
button:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}
button.p{background:var(--acc);color:#fff;font-weight:500;padding:11px 26px}button.p:hover{background:var(--acc);opacity:.88}
#drop button{padding:4px 6px;display:inline;font-size:inherit}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{border-radius:9px;padding:8px 14px;color:var(--ink);font-size:14px}
.seg button:hover{background:transparent}.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
#pnote{margin:16px 2px 0!important}
#bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(940px,calc(100% - 32px));margin:0;padding:12px 16px 12px 24px;border-radius:26px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);z-index:30;align-items:center;gap:12px}
#bar select{min-width:150px;padding:8px 12px}#bar label{display:inline;margin:0 6px 0 0}
.item{display:grid;grid-template-columns:150px 1fr;gap:24px;content-visibility:auto;contain-intrinsic-size:auto 320px}
.item img{width:150px;height:150px;object-fit:cover;border-radius:16px;background:var(--fill)}
.item>div>b{font-size:17px;font-weight:600;display:block;margin-bottom:8px;word-break:break-all}
.tag{display:inline-block;font-size:13px;padding:3px 11px;border-radius:980px;background:var(--fill);color:var(--mute);margin:0 6px 6px 0}
.tag.tp{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:500}
.tag.via{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.flag{color:var(--warn);font-size:14px;margin-top:6px}.err{color:var(--bad)}
.f{margin:12px 0 0}.f b{font-size:13px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;margin:0 2px 6px}
.f textarea{width:100%;resize:vertical;min-height:44px;line-height:1.4}
.cnt{font-size:13px;color:var(--mute);font-weight:400}.cnt.over{color:var(--bad)}
details{margin-top:14px}details summary{cursor:pointer;color:var(--acc);font-size:15px}
pre{white-space:pre-wrap;font:14px/1.5 inherit;font-family:inherit;color:var(--mute);background:var(--fill);padding:14px;border-radius:12px;margin:12px 0 0}
/* model chain */
#chainwrap .hrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#chainwrap .hrow b{font-size:17px;font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
#chain .mrow:last-child{border-bottom:0}
.mrow code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);padding:3px 9px;border-radius:8px;white-space:nowrap}
.pill{font-size:12px;padding:2px 10px;border-radius:980px;background:var(--fill);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.grow{flex:1 1 auto;min-width:8px}
.why{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.mrow button{padding:4px 12px;font-size:13px;border:1px solid var(--line)}
#log{max-height:220px;overflow:auto;margin-top:6px}
#log div{font-size:13px;color:var(--mute);padding:4px 0;border-bottom:1px solid var(--line)}
#log div:last-child{border-bottom:0}
#log b{font-weight:500;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:640px){.item{grid-template-columns:1fr}.item img{width:100%;height:200px}.hero{padding-top:48px}.panel{padding:20px}#bar{border-radius:22px}.why{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav class="nav"><b>Metadata Studio</b><span id="navp"></span></nav>
<header class="hero"><h1>Metadata that ranks.</h1>
<p>Drop your images. It tells a single background from a template pack, then writes the titles and keywords buyers actually search for.</p></header>
<main>
<section class="panel" id="drop" tabindex="0"><span class="big">Drop images here</span>or <button id="pick">choose files</button><input id="files" type="file" accept="image/*" multiple hidden></section>

<section class="panel"><div class="row">
 <div><label for="prov">Provider</label><select id="prov"></select></div>
 <div style="flex:1 1 320px"><label for="key">API key(s)</label><input id="key" type="password" autocomplete="off" placeholder="Paste your key — several keys, comma separated, rotate automatically"></div>
</div>
<div class="row" style="margin-top:16px">
 <div style="flex:1 1 280px"><label for="model">Model</label><input id="model" placeholder="auto"></div>
 <div style="flex:1 1 240px" id="burlw"><label for="burl">Base URL</label><input id="burl"></div>
 <button id="scan">Check models</button>
</div>
<div style="margin-top:22px"><label>Content type</label><div class="seg" id="hint">
 <button data-v="" class="on">Auto-detect</button><button data-v="single_asset">Single background</button><button data-v="template_pack">Template / design pack</button></div></div>
<p class="cnt" id="pnote"></p></section>

<section class="panel" id="chainwrap" hidden>
 <div class="hrow"><div><b>Model fallback chain</b><div class="cnt" id="chainnote" style="margin-top:4px"></div></div>
 <div><button id="scan2">Check models</button><button id="reset">Reset status</button></div></div>
 <div id="chain"></div>
 <details id="logwrap"><summary>Activity log</summary><div id="log"></div></details>
</section>

<div class="panel row" id="bar" hidden>
 <button class="p" id="run">Generate metadata</button>
 <span class="cnt" id="stat"></span><span style="flex:1"></span>
 <div><label for="plat">Export</label><select id="plat"><option value="adobe">Adobe Stock</option><option value="shutterstock">Shutterstock</option><option value="freepik">Freepik</option><option value="istock">iStock / Getty</option></select></div>
 <button id="exp">Download CSV</button>
</div>
<div id="list"></div>
</main>

<script id="core">
/* ---------- Provider registry ---------- */
/* Static chains are only a fallback: every provider is re-listed live from its own
   /models endpoint when the app can, so new models appear without a code change. */
const GEMINI_STATIC=["gemini-3.8-flash","gemini-3.7-flash","gemini-3.6-flash","gemini-3.5-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash","gemini-flash-latest","gemini-flash-lite-latest"];
const PROVIDERS=[
 {id:"gemini",label:"Google Gemini",wire:"gemini",baseUrl:"https://generativelanguage.googleapis.com/v1beta",model:"auto",models:GEMINI_STATIC,custom:true,
  note:'Free tier. “auto” lists every model your key can use and tries them best-first; a model that is out of quota, retired, rate-limited or unable to read images is skipped automatically and the next one takes over — mid-run, per image. Type model names here (comma separated) to pin your own order in front of the chain.'},
 {id:"deepseek",label:"DeepSeek",wire:"openai",baseUrl:"https://api.deepseek.com/v1",model:"auto",models:["deepseek-chat","deepseek-reasoner"],custom:true,
  note:'OpenAI-compatible. “auto” discovers the models this key can use, then falls back down the chain.'},
 {id:"openai",label:"OpenAI",wire:"openai",baseUrl:"https://api.openai.com/v1",model:"auto",models:["gpt-4o","gpt-4o-mini"],custom:true,
  note:'“auto” discovers your models and falls back down the chain.'},
 {id:"anthropic",label:"Anthropic Claude",wire:"anthropic",baseUrl:"https://api.anthropic.com/v1",model:"auto",models:["claude-sonnet-4-5","claude-3-7-sonnet-latest","claude-3-5-haiku-latest"],custom:true,
  note:'“auto” lists the models this key can use and falls back down the chain.'},
 ...["xKiro","Vyce","Helyx","AgentRouter","SeekAi"].map(n=>({id:n.toLowerCase(),label:n+" (gateway)",wire:"openai",baseUrl:"",model:"auto",models:[],custom:true,note:"OpenAI-compatible gateway: enter its base URL. “auto” lists the models it offers and falls back down the chain."}))
];
const DEFAULT_PROVIDER="gemini";

/* ---------- Platform limits ---------- */
const LIM={adobe:{title:70,kw:49},shutterstock:{desc:200,kw:50},freepik:{title:70,kw:30},istock:{title:70,desc:200,kw:50}};
const FILLER=/^(stunning|beautiful|amazing|high quality|hd|4k|best|nice|perfect|unique|awesome|gorgeous|great|wonderful|premium|professional|creative)$/i;
const TP_CATEGORY="Graphic Resources",SA_CATEGORY="Backgrounds/Textures";

/* ---------- System prompt ---------- */
/* NOTE: rules A-G are reconstructed from the brief; edit RULES_AG to match your original wording. */
const RULES_AG=`SINGLE_ASSET RULES (A-G):
A. COLORS: include 2-5 accurate dominant color words in the keywords (and in the title where natural).
B. USE-CASE POOL: include general use-case keywords that genuinely fit: background, wallpaper, backdrop, banner, website, presentation, social media, print, packaging, poster, card, texture, pattern.
C. NO FILLER: never use filler or subjective words (stunning, beautiful, amazing, high quality, 4k, perfect, unique, best) and never use brand names or trademarks.
D. NO CONTRADICTIONS: never include a term that conflicts with the image (wrong color, "photo" for vector art, "text" when none is visible, etc.).
E. TAGS: 25-49 keywords ordered by importance, single words or short phrases, no duplicates and no singular/plural duplicates.
F. ACCURACY: describe only what is visible; no people, places or brands unless clearly identifiable.
G. TITLE: one natural sentence describing the ONE visual, at most 70 characters for Adobe/Freepik (real ceiling), not a keyword dump. Shutterstock description at most 200 characters.`;
const RULES_HK=`TEMPLATE_PACK RULES (use A-F above, plus H-K; H supersedes G's single-scene framing but keeps its character limits):
H. COLLECTION-STYLE TITLE: describe what the SET contains, not one scene: list 2-4 of the most visually distinct elements present (e.g. "flowing waves, 3D spheres, mesh lines, geometric bars"), the overall style/color direction, and what kind of templates they are (poster templates, cover designs, banner set...). Natural sentence, not a keyword dump. Adobe/Freepik titles must be at most 70 characters: if the fuller description does not fit, keep the 2-3 most commercially distinctive elements and drop the rest rather than exceeding the limit.
I. DESIGN-PURPOSE KEYWORDS: in addition to rule B use-cases and rule A colors, include terms for what the pack is for and made of, from (use only what fits): template, poster, layout, cover, flier, booklet, banner, collection, set, presentation, mockup, print, editable design, vector template, business card, brochure.
J. VECTOR-TEXT WORDING: for outlined/customizable text write "replaceable text", never "editable text" (Adobe guidance). "Editable" is fine for shapes/colors in general, not for text.
K. CATEGORY: category_suggestion must be "Graphic Resources" (or the platform's closest equivalent), never Backgrounds/Textures. If the file appears to be a vector, add a flag such as "Looks like a vector template: confirm actual file type (AI/EPS) before export" because a JPEG preview cannot reveal the real format.`;
function buildSystem(hint){
 return `You are a microstock metadata specialist. Follow these steps.
STEP 1 - CLASSIFY the image as "single_asset" (one background/texture/photo/illustration used as-is) or "template_pack" (a composed layout, poster mockup, or multi-element design composition arranged as a template/cover-style layout; something a designer would call a template, not a plain background).${hint?` The user has already specified: "${hint}". Use that value.`:" No hint was given; decide from the image."}
STEP 2 - Generate metadata using the matching rule set.
${RULES_AG}
${RULES_HK}
SELF-CHECK before answering: single_asset output must satisfy A-G. template_pack output must satisfy A-F plus H-K (title lists 2-4 contained elements, fits the character limit, has design-purpose keywords, says "replaceable text" not "editable text", category is Graphic Resources). Confirm content_type is stated correctly.
Return ONLY JSON, no markdown:
{"content_type":"single_asset|template_pack","description":"...","platforms":{"adobe":{"title":"","keywords":[]},"shutterstock":{"description":"","keywords":[]},"freepik":{"title":"","keywords":[]},"istock":{"title":"","description":"","keywords":[]}},"category_suggestion":"...","flags":[]}`;
}

/* ---------- Validation layer ---------- */
function cutWords(s,n){s=String(s||"").replace(/\s+/g," ").trim();if(s.length<=n)return s;let c=s.slice(0,n+1),i=c.lastIndexOf(" ");c=(i>n*0.6?c.slice(0,i):s.slice(0,n));return c.replace(/[,;:\-\s]+$/,"")}
function fixText(s,type){if(type!=="template_pack")return s;return s.replace(/\beditable\s+(text|font|fonts|typography|lettering|type|copy)\b/gi,"replaceable $1")}
function cleanKw(a,max,type){
 const seen=new Set(),out=[];
 for(let k of (Array.isArray(a)?a:String(a||"").split(/[,;]/))){
  k=fixText(String(k).toLowerCase().replace(/["']/g,"").replace(/\s+/g," ").trim(),type);
  if(!k||FILLER.test(k))continue;
  const stem=k.replace(/(es|s)$/,"");if(seen.has(k)||seen.has(stem))continue;
  seen.add(k);seen.add(stem);out.push(k);if(out.length>=max)break}
 return out}
function normalize(raw,hint){
 let d=raw;if(typeof raw==="string"){const m=raw.replace(/```json|```/g,"").match(/\{[\s\S]*\}/);if(!m)throw new Error("No JSON in model reply");d=JSON.parse(m[0])}
 const flags=Array.isArray(d.flags)?d.flags.map(String):[];
 let type=d.content_type;
 if(type!=="single_asset"&&type!=="template_pack"){type="single_asset";flags.push("Model gave no valid content_type; defaulted to single_asset")}
 if(hint&&hint!==type){flags.push(`Model classified as ${type}; overridden by your toggle (${hint})`);type=hint}
 const P=d.platforms||{},o={};
 const title=(t,n,pl)=>{t=fixText(String(t||""),type);const c=cutWords(t,n);if(c!==t.trim())flags.push(`${pl} title trimmed to ${n} chars`);return c};
 o.adobe={title:title(P.adobe?.title,LIM.adobe.title,"Adobe"),keywords:cleanKw(P.adobe?.keywords,LIM.adobe.kw,type)};
 o.shutterstock={description:cutWords(fixText(P.shutterstock?.description||"",type),LIM.shutterstock.desc),keywords:cleanKw(P.shutterstock?.keywords,LIM.shutterstock.kw,type)};
 o.freepik={title:title(P.freepik?.title,LIM.freepik.title,"Freepik"),keywords:cleanKw(P.freepik?.keywords,LIM.freepik.kw,type)};
 o.istock={title:title(P.istock?.title,LIM.istock.title,"iStock"),description:cutWords(fixText(P.istock?.description||"",type),LIM.istock.desc),keywords:cleanKw(P.istock?.keywords,LIM.istock.kw,type)};
 let cat=String(d.category_suggestion||"");
 if(type==="template_pack"){
  if(!/graphic resources|graphics|templates?/i.test(cat)){cat=TP_CATEGORY;flags.push("Category corrected to Graphic Resources")}
  for(const pl of Object.keys(o)){const k=o[pl].keywords;if(!k.some(x=>/template/.test(x)))flags.push(`${pl}: no "template" keyword present`)}
  if(!flags.some(f=>/vector|AI\/EPS/i.test(f)))flags.push("Possible vector template: confirm actual file type (AI/EPS) before export");
 }else if(!cat||/graphic resources/i.test(cat))cat=SA_CATEGORY;
 if(o.adobe.keywords.length<25)flags.push(`Adobe has only ${o.adobe.keywords.length} keywords (aim for 25+)`);
 return{content_type:type,description:String(d.description||""),platforms:o,category_suggestion:cat,flags:[...new Set(flags)]};
}

/* ---------- CSV ---------- */
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
const sq=s=>"'"+String(s).replace(/'/g,"''")+"'";
function buildCsv(items,pl){
 const ok=items.filter(i=>i.meta),warn=[];let rows=[];
 for(const it of ok){const m=it.meta,p=m.platforms;
  if(pl==="adobe"){let fn=it.name;if(fn.length>30){warn.push(`"${fn}" exceeds Adobe's 30-char filename cap`);}rows.push([fn,p.adobe.title,p.adobe.keywords.join(", "),m.category_suggestion].map(q).join(","))}
  else if(pl==="shutterstock")rows.push([it.name,p.shutterstock.description,p.shutterstock.keywords.join(", "),m.category_suggestion].map(q).join(","));
  else if(pl==="freepik")rows.push([it.name,p.freepik.title,p.freepik.keywords.join(", ")].map(sq).join(";"));
  else rows.push([it.name,p.istock.description,"",p.istock.title,p.istock.keywords.join(", ")].map(q).join(","));}
 const head={adobe:'Filename,Title,Keywords,Category',shutterstock:'Filename,Description,Keywords,Categories',freepik:"'Filename';'Title';'Keywords'",istock:'file name,description,country,title,keywords'}[pl];
 return{csv:[head,...rows].join("\r\n"),warn};
}

/* ================= Model fallback engine =================
   One job: never answer "model not working" when any other model could have
   answered. Every provider gets an ordered chain; a failure on one model moves
   to the next one automatically, for the same image, inside the same run. */
const NON_CHAT=/(^|[-_])(embedding|embed|aqa|imagen|veo|tts|audio|live|music|transcribe|whisper|dall|moderation|rerank|bge|clip|image|images|robotics|computer|video)([-_]|$)/i;
const CHAIN={models:{},keyCursor:{},discovered:{},discovering:{},log:[],lastGood:{}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const baseModel=id=>String(id||"").replace(/^models\//,"").trim();
const parseKeys=s=>[...new Set(String(s||"").split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
const mstate=(pid,m)=>CHAIN.models[pid+"::"+m]||(CHAIN.models[pid+"::"+m]={status:"ready",uses:0,until:0,reason:""});
function resetStatus(){for(const k in CHAIN.models)delete CHAIN.models[k];CHAIN.keyCursor={};CHAIN.log=[]}

/* Rank = quality order: newer generation first, flash over flash-lite, pro over both,
   preview/experimental models behind their stable siblings, unknown families last. */
function rankModel(id){
 const s=String(id||"").toLowerCase();let sc=0;
 const v=s.match(/gemini-(\d+)(?:\.(\d+))?/);
 if(v)sc+=(+v[1])*100+(+(v[2]||0))*10;
 if(/flash-lite|lite|8b|-mini|nano/.test(s))sc+=0;
 else if(/flash/.test(s))sc+=80;
 else if(/pro|ultra|opus|sonnet|o[1-9]\b|gpt-5/.test(s))sc+=120;
 else sc-=200;
 if(/preview|exp\b|experimental|beta/.test(s))sc-=55;
 if(/latest/.test(s))sc+=5;
 return sc;
}
function modelPool(p,cfg){
 const typed=String(cfg.model||"").split(/[\n,;]+/).map(baseModel).filter(x=>x&&x.toLowerCase()!=="auto");
 const disc=(CHAIN.discovered[p.id]||[]).map(baseModel);
 const discChat=disc.filter(m=>!NON_CHAT.test(m)),discOdd=disc.filter(m=>NON_CHAT.test(m));
 const seen=new Set(),out=[];
 const push=(m,score)=>{m=baseModel(m);if(!m||seen.has(m.toLowerCase()))return;seen.add(m.toLowerCase());out.push({model:m,score})};
 typed.forEach((m,i)=>push(m,1e6-i));                       // what the user typed, in order
 discChat.slice().sort((a,b)=>rankModel(b)-rankModel(a)).forEach(m=>push(m,rankModel(m)));
 if(!discChat.length)(p.models||[]).forEach(m=>push(m,rankModel(m)));   // no live list: use the built-in one
 discOdd.slice().sort((a,b)=>rankModel(b)-rankModel(a)).forEach(m=>push(m,rankModel(m)-1e4));
 return out.sort((a,b)=>b.score-a.score).map(x=>x.model);
}
function chainFor(p,cfg){return modelPool(p,cfg||{})}
function chainStatus(p,cfg){
 const now=Date.now();
 return chainFor(p,cfg).map(m=>{const st=mstate(p.id,m);return{model:m,status:st.status,uses:st.uses,
  waitMs:st.until>now?st.until-now:0,reason:st.reason,ready:!st.dead&&st.until<=now}});
}

/* ---------- Transport ---------- */
function apiErr(status,msg,body){const e=new Error(msg||("HTTP "+status));e.status=status;e.body=body;return e}
async function fetchT(url,opts,ms){
 const ac=typeof AbortController!=="undefined"?new AbortController():null;
 const t=ac?setTimeout(()=>ac.abort(),ms||120000):null;
 try{return await fetch(url,{...opts,signal:ac?ac.signal:undefined})}
 catch(e){const to=ac&&/abort/i.test(String(e&&e.name)+String(e&&e.message));
  const err=new Error(to?"Request timed out after "+Math.round((ms||120000)/1000)+"s":"Network/CORS blocked this request ("+((e&&e.message)||e)+")");err.net=true;throw err}
 finally{ac&&clearTimeout(t)}
}
function retryAfterMs(body){
 let d=body&&body.error&&body.error.details;
 if(Array.isArray(d))for(const x of d){if(x&&x.retryDelay!=null){const s=parseFloat(String(x.retryDelay));if(!isNaN(s))return s*1000}}
 const m=String((body&&body.error&&body.error.message)||"").match(/retry(?:\s+in)?\s+([\d.]+)\s*s/i);
 return m?parseFloat(m[1])*1000:0;
}
const quotaIsDaily=(body,msg)=>/per\s?day|perday|daily|requests per day|rpd/i.test(JSON.stringify(body||{})+" "+msg);
function classifyError(e){
 const st=(e&&e.status)||0,msg=String((e&&e.message)||"");
 if(e&&e.net)return{kind:"net"};
 if(!st)return{kind:"net"};
 if(st===401)return{kind:"auth"};
 if(st===403)return/not supported|not found|does not support|permission.*model|model.*permission/i.test(msg)?{kind:"model"}:{kind:"auth"};
 if(st===429)return{kind:"quota",retryAfterMs:retryAfterMs(e.body),daily:quotaIsDaily(e.body,msg)};
 if(st===404)return{kind:"model"};
 if(st===400&&/api[\s_-]?key/i.test(msg))return{kind:"auth"};
 if(st===400&&/(not found|does not exist|not supported|unsupported|unable to process input image|invalid image|image input|does not support|no longer available|deprecated|not available|is not available)/i.test(msg))return{kind:"model"};
 if(st===400||st===422)return{kind:"payload"};
 if(st>=500)return{kind:"transient"};
 return{kind:"other"};
}

/* ---------- Model discovery (live list, so new models show up by themselves) ---------- */
async function discover(p,cfg){
 const keys=parseKeys(cfg.key);
 if(!keys.length)throw new Error("Enter an API key first");
 const key=keys[(CHAIN.keyCursor[p.id]||0)%keys.length];
 const base=String(cfg.baseUrl||p.baseUrl||"").replace(/\/+$/,"");
 let ids=[];
 if(p.wire==="gemini"){
  const r=await fetchT(base+"/models?pageSize=1000",{headers:{"x-goog-api-key":key}},25000);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||("HTTP "+r.status),j);
  ids=(j.models||[]).filter(m=>!(m.supportedGenerationMethods&&m.supportedGenerationMethods.length)||m.supportedGenerationMethods.includes("generateContent")).map(m=>baseModel(m.name));
 }else if(p.wire==="anthropic"){
  const r=await fetchT(base+"/models?limit=100",{headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}},25000);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||("HTTP "+r.status),j);
  ids=(j.data||[]).map(m=>baseModel(m.id));
 }else{
  const r=await fetchT(base+"/models",{headers:{Authorization:"Bearer "+key}},25000);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||("HTTP "+r.status),j);
  ids=(j.data||[]).filter(m=>m&&!m.deleted).map(m=>baseModel(m.id)).filter(m=>m&&!NON_CHAT.test(m));
 }
 CHAIN.discovered[p.id]=[...new Set(ids.filter(Boolean))];
 return CHAIN.discovered[p.id];
}
function ensureDiscovered(p,cfg){
 if(CHAIN.discovered[p.id])return Promise.resolve(CHAIN.discovered[p.id]);
 if(!CHAIN.discovering[p.id])CHAIN.discovering[p.id]=discover(p,cfg).catch(()=>null).finally(()=>{CHAIN.discovering[p.id]=null});
 return CHAIN.discovering[p.id];
}

/* ---------- One attempt against one model ---------- */
async function callModel(p,cfg,model,key,variant,req){
 const base=String(cfg.baseUrl||p.baseUrl||"").replace(/\/+$/,"");
 const mime=req.dataUrl.slice(5,req.dataUrl.indexOf(";")),b64=req.dataUrl.split(",")[1];
 const json={"Content-Type":"application/json"};
 if(p.wire==="gemini"){
  const body={systemInstruction:{parts:[{text:req.system}]},contents:[{role:"user",parts:[{text:req.text},{inline_data:{mime_type:mime,data:b64}}]}],
   generationConfig:{maxOutputTokens:8192,...(variant?{}:{temperature:0.4,responseMimeType:"application/json"})}};
  const r=await fetchT(base+"/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",headers:{...json,"x-goog-api-key":key},body:JSON.stringify(body)},120000);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||("HTTP "+r.status),j);
  if(j.promptFeedback&&j.promptFeedback.blockReason)throw apiErr(200,"Blocked by the safety filter ("+j.promptFeedback.blockReason+")",j);
  const c=(j.candidates||[])[0];
  if(!c)throw apiErr(200,"The model returned no answer",j);
  if(/MAX_TOKENS/i.test(c.finishReason||""))throw apiErr(200,"Answer cut off (MAX_TOKENS)",j);
  const out=((c.content&&c.content.parts)||[]).filter(x=>x&&x.text&&x.thought!==true).map(x=>x.text).join("");
  if(!out.trim())throw apiErr(200,"Empty answer"+(c.finishReason?" ("+c.finishReason+")":""),j);
  return out;
 }
 if(p.wire==="openai"){
  const body={model,messages:[{role:"system",content:req.system},{role:"user",content:[{type:"text",text:req.text},{type:"image_url",image_url:{url:req.dataUrl}}]}],
   ...(variant?{}:{temperature:0.4,response_format:{type:"json_object"}})};
  const r=await fetchT(base+"/chat/completions",{method:"POST",headers:{...json,Authorization:"Bearer "+key},body:JSON.stringify(body)},120000);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||(j.message)||("HTTP "+r.status),j);
  const msg=(j.choices||[])[0]&&(j.choices||[])[0].message;
  const out=(msg&&msg.content)||"";
  if(!String(out).trim())throw apiErr(200,"Empty answer",j);
  return out;
 }
 const body={model,max_tokens:variant?4096:8192,...(variant?{}:{temperature:0.4}),system:req.system,
  messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:b64}},{type:"text",text:req.text}]}]};
 const r=await fetchT(base+"/messages",{method:"POST",headers:{...json,"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)},120000);
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw apiErr(r.status,(j.error&&j.error.message)||("HTTP "+r.status),j);
 const out=(j.content||[]).map(x=>x&&x.text||"").join("");
 if(!out.trim())throw apiErr(200,"Empty answer with stop_reason "+(j.stop_reason||"?"),j);
 return out;
}
async function attempt(p,cfg,model,key,variant,req){
 try{return await callModel(p,cfg,model,key,variant,req)}
 catch(e1){
  const c=classifyError(e1);
  if(c.kind==="transient"||c.kind==="net"){                 // one breathe, then same model again
   await sleep(600+Math.random()*700);
   try{return await callModel(p,cfg,model,key,variant,req)}catch(e2){throw e2}
  }
  throw e1;
 }
}

/* ---------- The fallback runner ---------- */
function explainFailures(tried,p){
 if(!tried.length)return "All models in the chain are cooling down or retired. Open “Model fallback chain”, hit Reset status, or add another API key.";
 const seen=new Set(),lines=[];
 for(const t of tried){const k=t.model+"|"+t.kind;if(seen.has(k))continue;seen.add(k);
  lines.push("• "+t.model+" — "+({auth:"key rejected",model:"not available to this key",quota:"out of quota / rate limited",payload:"rejected the request shape",transient:"server busy",net:"cannot be reached (network or CORS)",other:"failed"}[t.kind]||t.kind)+": "+String(t.error).slice(0,120))}
 return "Every model in the chain failed for "+p.label+".\n"+lines.join("\n")+"\nCheck the key, or add a second key separated by a comma.";
}
async function generate(p,cfg,req,onEvent){
 const keys=parseKeys(cfg.key);
 if(!keys.length)throw new Error("Enter an API key for "+p.label);
 if(!CHAIN.discovered[p.id]){                       // list the live models once per session
  try{const n=await ensureDiscovered(p,cfg);if(n&&n.length)onEvent&&onEvent({t:"info",msg:n.length+" models listed for "+p.label})}
  catch(e){onEvent&&onEvent({t:"info",msg:"Model list unavailable ("+e.message+"), using the built-in chain"})}
 }
 const order=chainFor(p,cfg);
 if(!order.length)throw new Error("No models to try. Enter a model name or a base URL that lists models.");
 const tried=[],keysDead=new Set();
 let sawDead=false;
 for(const model of order){
  const st=mstate(p.id,model),now=Date.now();
  if(st.dead){sawDead=true;onEvent&&onEvent({t:"skip",model,msg:"skipped: "+st.reason});continue}
  if(st.until>now){sawDead=true;onEvent&&onEvent({t:"skip",model,msg:"cooling "+Math.ceil((st.until-now)/1000)+"s"});continue}
  let nextModel=false;
  for(let ki=0;ki<keys.length&&!nextModel;ki++){
   const idx=((CHAIN.keyCursor[p.id]||0)+ki)%keys.length;
   if(keysDead.has(idx))continue;
   const key=keys[idx];
   for(let variant=0;variant<2&&!nextModel;variant++){
    try{
     const raw=await attempt(p,cfg,model,key,variant,req);
     st.status="ok";st.uses++;st.until=0;st.reason="";CHAIN.keyCursor[p.id]=idx;CHAIN.lastGood[p.id]=model;
     onEvent&&onEvent({t:"ok",model,msg:"ok"+(keys.length>1?" (key "+(idx+1)+"/"+keys.length+")":"")});
     return{raw,model,key};
    }catch(e){
     const c=classifyError(e);
     tried.push({model,kind:c.kind,error:e.message});
     onEvent&&onEvent({t:"fail",model,msg:({auth:"key rejected",model:"not available",quota:"out of quota",payload:"bad request shape",transient:"server busy",net:"unreachable",other:"failed"}[c.kind]||c.kind)+": "+String(e.message).slice(0,110)});
     if(c.kind==="payload"&&variant===0)continue;                    // retry once with a minimal body
     if(c.kind==="model"){st.dead=true;st.status="dead";st.reason=String(e.message).slice(0,90);nextModel=true;break}
     if(c.kind==="auth"){keysDead.add(idx);if(keys.length>1)onEvent&&onEvent({t:"info",msg:"switching API key"});break}
     if(c.kind==="quota"){
      if(!c.daily&&ki<keys.length-1)break;                          // another key may have its own quota
      st.status="cooling";st.reason=c.daily?"daily quota":"rate limit";
      st.until=Date.now()+Math.max(c.retryAfterMs||0,c.daily?6*3600*1000:20000);
      nextModel=true;break;
     }
     if(ki<keys.length-1)break;                                     // try the next key on transient/net/other
     nextModel=true;break;
    }
   }
  }
 }
 if(keysDead.size>=keys.length&&tried.every(t=>t.kind==="auth"))throw new Error("Every API key was rejected by "+p.label+". Check for a typo, or that the key is enabled for the Gemini/OpenAI API.");
 throw new Error(explainFailures(tried,p));
}
/* tiny, cheap probe used by the “test” button in the chain list */
async function probeModel(p,cfg,model){
 const keys=parseKeys(cfg.key);if(!keys.length)throw new Error("Enter an API key first");
 const key=keys[(CHAIN.keyCursor[p.id]||0)%keys.length];
 const base=String(cfg.baseUrl||p.baseUrl||"").replace(/\/+$/,"");
 const tiny={system:"You are a health check.",text:"Reply with the single word: ok",dataUrl:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q=="};
 try{const raw=await callModel(p,cfg,model,key,1,tiny);const st=mstate(p.id,model);st.status="ok";st.uses++;st.until=0;st.reason="";return{ok:true,note:"answered"}}
 catch(e){const c=classifyError(e),st=mstate(p.id,model);
  if(c.kind==="model"){st.dead=true;st.status="dead";st.reason=String(e.message).slice(0,90)}
  else if(c.kind==="quota"){st.status="cooling";st.reason=c.daily?"daily quota":(c.retryAfterMs?"retry in "+Math.ceil(c.retryAfterMs/1000)+"s":"rate limit");st.until=Date.now()+Math.max(c.retryAfterMs||0,c.daily?6*3600*1000:20000)}
  else if(c.kind==="auth"){st.status="dead";st.dead=true;st.reason="key rejected"}
  else{st.status="warn";st.reason=String(e.message).slice(0,90)}
  return{ok:false,cause:c.kind,note:String(e.message).slice(0,140)}}
}
/* exposed for the console, and for the test harness in tests/ */
globalThis.__MM={PROVIDERS,CHAIN,chainFor,chainStatus,discover,ensureDiscovered,generate,probeModel,classifyError,rankModel,parseKeys,normalize,buildSystem,buildCsv,mstate,resetStatus,callModel};
</script>

<script id="ui">
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let items=[],hint="";
const cfgs=store.get("cfgs")||{};
$("prov").innerHTML=PROVIDERS.map(p=>`<option value="${p.id}">${p.label}${p.id===DEFAULT_PROVIDER?" (default)":""}</option>`).join("");
$("prov").value=store.get("prov")||DEFAULT_PROVIDER;
const cur=()=>PROVIDERS.find(p=>p.id===$("prov").value);
function cfgOf(p){const c=cfgs[p.id]||{};return{key:$("key").value,model:$("model").value,baseUrl:$("burl").value}}
function loadCfg(){const p=cur(),c=cfgs[p.id]||{};$("key").value=c.key||"";$("model").value=c.model||"auto";$("burl").value=c.baseUrl||p.baseUrl;
 $("pnote").textContent=p.note||"";store.set("prov",p.id);renderChain()}

$("prov").onchange=loadCfg;
["key","model","burl"].forEach(i=>$(i).oninput=()=>{saveCfg();$("navp").textContent=cur().label+" · "+($("model").value||"auto")});

loadCfg();

/* ---------- model chain panel ---------- */
let chainTimer=null;
function chainRenderSoon(){clearTimeout(chainTimer);chainTimer=setTimeout(renderChain,220)}
function fmtWait(ms){ms=Math.max(0,ms);if(ms<60000)return Math.ceil(ms/1000)+"s";if(ms<3600000)return Math.ceil(ms/60000)+"m";return Math.ceil(ms/3600000)+"h"}
function renderChain(){

  const cls=x.status==="dead"?"bad":(x.status==="cooling"||x.status==="warn")?"warn":x.status==="ok"?"ok":"";
  const label=x.status==="dead"?"not available":x.status==="cooling"?"cooling "+fmtWait(x.waitMs):x.status==="ok"?"working"+(x.uses>1?` ×${x.uses}`:""):x.status==="warn"?"error":"not tried";
  return `<div class="mrow"><span class="dot ${cls}"></span><code>${x.model}</code><span class="pill ${cls}">${label}</span><span class="grow"></span><span class="why" title="${(x.reason||"").replace(/"/g,"&quot;")}">${x.reason||""}</span><button data-m="${x.model}">test</button></div>`}).join("")||`<div class="cnt">No models yet — enter a key and hit Check models.</div>`;
 $("chain").querySelectorAll("button[data-m]").forEach(b=>b.onclick=async()=>{const m=b.dataset.m;b.textContent="…";
  const r=await probeModel(cur(),cfgOf(cur()),m);addLog({t:r.ok?"ok":"fail",model:m,msg:r.ok?"health check ok":"health check: "+r.note});b.textContent="test";renderChain()});

function addLog(ev){const time=new Date().toLocaleTimeString();CHAIN.log.unshift({time,...ev});if(CHAIN.log.length>80)CHAIN.log.pop();

$("scan").onclick=$("scan2").onclick=async()=>{const p=cur();const btn=$("scan");btn.textContent="Listing…";

 catch(e){addLog({t:"fail",msg:"Could not list models: "+e.message})}

/* ---------- upload ---------- */
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res({url:c.toDataURL("image/jpeg",.85)});URL.revokeObjectURL(u)};im.onerror=()=>rej(new Error("Cannot read image"));im.src=u})}

$("pick").onclick=()=>$("files").click();$("files").onchange=e=>addFiles(e.target.files);

/* ---------- results ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function field(label,val,lim,path){const n=val.length,over=lim&&n>lim;return `<div class="f"><b>${label} <span class="cnt ${over?"over":""}">${lim?n+"/"+lim:n}</span></b><textarea data-p="${path}" rows="${val.length>90?3:1}">${esc(val)}</textarea></div>`}
function render(){$("list").innerHTML=items.map((it,i)=>{const m=it.meta,body=it.err?`<div class="err">${esc(it.err).replace(/\n/g,"<br>")}</div>`:it.busy?`Working…${it.attempts&&it.attempts.length?` <span class="cnt">(${esc(it.attempts[it.attempts.length-1].model||"")})</span>`:""}`:m?`
 <div><span class="tag ${m.content_type==="template_pack"?"tp":""}">${m.content_type==="template_pack"?"Template pack":"Single asset"}</span><span class="tag">${esc(m.category_suggestion)}</span>${m.model?`<span class="tag via">via ${esc(m.model)}</span>`:""}</div>
 ${field("Adobe title",m.platforms.adobe.title,70,i+".adobe.title")}
 <div class="f"><b>Adobe keywords <span class="cnt">${m.platforms.adobe.keywords.length}/49</span></b><textarea data-p="${i}.adobe.kw" class="kw" rows="3">${esc(m.platforms.adobe.keywords.join(", "))}</textarea></div>
 ${m.flags.map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join("")}
 <details><summary>Other platforms and raw description</summary>
  ${field("Shutterstock description",m.platforms.shutterstock.description,200,i+".ss.d")}
  ${field("Freepik title",m.platforms.freepik.title,70,i+".fp.t")}
  ${field("iStock title",m.platforms.istock.title,70,i+".is.t")}<pre>${esc(m.description)}</pre></details>`:"Queued";
 return `<div class="panel item"><img src="${it.url}" alt=""><div><b>${esc(it.name)}</b>${body}</div></div>`}).join("");
 $("list").querySelectorAll("textarea").forEach(t=>t.onchange=()=>{const[i,pl,f]=t.dataset.p.split("."),p=items[i].meta.platforms;
  if(pl==="adobe"){if(f==="title")p.adobe.title=t.value;else p.adobe.keywords=cleanKw(t.value,49,items[i].meta.content_type)}
  else if(pl==="ss")p.shutterstock.description=t.value;else if(pl==="fp")p.freepik.title=t.value;else p.istock.title=t.value});
 const d=items.filter(i=>i.meta).length;$("stat").textContent=`${d}/${items.length} done`+(CHAIN.lastGood[cur().id]?` · via ${CHAIN.lastGood[cur().id]}`:"")}

/* ---------- run ---------- */
async function work(it){

  const{raw,model}=await generate(p,cfg,{system:buildSystem(hint),text:"Classify and generate metadata for this image.",dataUrl:it.url},
   ev=>{if(ev.t==="fail"||ev.t==="skip"){it.attempts.push(ev);bounced=true;addLog(ev)}

}
$("run").onclick=async()=>{if(!parseKeys($("key").value).length){alert("Enter an API key for "+cur().label);return}

$("navp").textContent=cur().label+" · "+($("model").value||"auto");
